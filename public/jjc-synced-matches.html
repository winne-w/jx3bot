        async function loadMatchDetail(matchId, focusPlayer) {
            if (!matchId) {
                return;
            }
            openModal(matchModal);
            matchModalTitle.textContent = "对局详情";
            matchModalSubtitle.textContent = "";
            matchModalBody.innerHTML = "<div class='modal-loading'>正在加载对局详情...</div>";
            const cached = matchDetailCache.get(String(matchId));
            if (cached) {
                renderMatchDetailModal(cached, focusPlayer);
                return;
            }
            try {
                const data = await fetchJson(buildMatchDetailUrl(matchId), { cache: "no-store" });
                matchDetailCache.set(String(matchId), data);
                renderMatchDetailModal(data, focusPlayer);
            } catch (error) {
                matchModalBody.innerHTML = "<div class='modal-loading error'>加载对局详情失败，请稍后再试</div>";
            }
        }

        function safeGetAnnouncementSeen() {
            try {
                return localStorage.getItem(ANNOUNCEMENT_SEEN_KEY);
            } catch (error) {
                return null;
            }
        }

        function safeSetAnnouncementSeen(value) {
            try {
                localStorage.setItem(ANNOUNCEMENT_SEEN_KEY, String(value || ""));
            } catch (error) {
                // localStorage can be unavailable in private contexts.
            }
        }

        function renderAnnouncementPopup(heroAnnouncement, listItems) {
            let html = "";
            if (heroAnnouncement) {
                html += `<div class="announcement-hero">
                    <div class="announcement-date">${escapeHtml(heroAnnouncement.date || "")}</div>
                    <h3 class="announcement-title">${escapeHtml(heroAnnouncement.title || "")}</h3>
                    <div class="announcement-body">${escapeHtml(heroAnnouncement.content || "")}</div>
                </div>`;
            }
            if (Array.isArray(listItems) && listItems.length) {
                html += '<div class="announcement-list-title">历史公告</div>';
                html += listItems.map((item) => `
                    <div class="announcement-list-item">
                        <div class="item-header">
                            <span class="item-date">${escapeHtml(item.date || "")}</span>
                            <span class="item-title">${escapeHtml(item.title || "")}</span>
                        </div>
                        <div class="item-body">${escapeHtml(item.content || "")}</div>
                    </div>
                `).join("");
            }
            if (announcementHasMore) {
                html += '<div id="announcement-sentinel" style="height:1px;"></div>';
                html += '<div id="announcement-loading" class="announcement-modal-loading" style="display:none;">加载中...</div>';
            }
            announcementBody.innerHTML = html || '<div class="modal-empty">暂无公告</div>';

            if (announcementHasMore) {
                const sentinel = document.getElementById("announcement-sentinel");
                if (sentinel) {
                    if (announcementObserver) {
                        announcementObserver.disconnect();
                    }
                    const modalCard = announcementModal.querySelector(".modal-card");
                    announcementObserver = new IntersectionObserver((entries) => {
                        if (entries[0].isIntersecting && announcementHasMore && !announcementLoading) {
                            loadMoreAnnouncements();
                        }
                    }, { root: modalCard, rootMargin: "80px" });
                    announcementObserver.observe(sentinel);
                }
            }
        }

        async function loadAnnouncementPage(heroAnnouncement) {
            announcementBody.innerHTML = '<div class="modal-loading">加载公告...</div>';
            announcementLoading = true;
            try {
                const url = new URL(`${ANNOUNCEMENT_API}/list`, window.location.origin);
                url.searchParams.set("limit", "5");
                if (announcementCursor !== null) {
                    url.searchParams.set("cursor", announcementCursor);
                }
                const data = await fetchJson(url.toString(), { cache: "no-store" });
                const listItems = data.announcements || [];
                announcementCursor = data.next_cursor;
                announcementHasMore = !!data.has_more;
                renderAnnouncementPopup(heroAnnouncement, listItems);
            } catch (error) {
                announcementBody.innerHTML = '<div class="modal-loading error">加载公告失败</div>';
            } finally {
                announcementLoading = false;
            }
        }

        function showAnnouncementPopup(heroAnnouncement, seenAt) {
            currentPopupSeenAt = seenAt;
            announcementCursor = null;
            announcementHasMore = true;
            announcementLoading = false;
            loadAnnouncementPage(heroAnnouncement);
            openModal(announcementModal);
        }

        async function openAnnouncementFromCircle() {
            try {
                const data = await fetchJson(`${ANNOUNCEMENT_API}/latest-date`, { cache: "no-store" });
                const hero = data.announcement || null;
                showAnnouncementPopup(hero, hero ? String(hero.created_at || "") : null);
            } catch (error) {
                showAnnouncementPopup(null, null);
            }
        }

        async function maybeShowAnnouncementOnLoad() {
            try {
                const data = await fetchJson(`${ANNOUNCEMENT_API}/latest-date`, { cache: "no-store" });
                const hero = data.announcement || null;
                if (!hero) {
                    return;
                }
                const seenAt = String(hero.created_at || "");
                if (seenAt && safeGetAnnouncementSeen() !== seenAt) {
                    showAnnouncementPopup(hero, seenAt);
                }
            } catch (error) {
                // Announcement availability is non-critical for the query page.
            }
        }

        async function loadMoreAnnouncements() {
            announcementLoading = true;
            const loadingEl = document.getElementById("announcement-loading");
            if (loadingEl) {
                loadingEl.style.display = "block";
            }
            try {
                const url = new URL(`${ANNOUNCEMENT_API}/list`, window.location.origin);
                url.searchParams.set("limit", "5");
                if (announcementCursor !== null) {
                    url.searchParams.set("cursor", announcementCursor);
                }
                const data = await fetchJson(url.toString(), { cache: "no-store" });
                const items = data.announcements || [];
                announcementCursor = data.next_cursor;
                announcementHasMore = !!data.has_more;
                const sentinel = document.getElementById("announcement-sentinel");
                const container = sentinel ? sentinel.parentNode : announcementBody;
                items.forEach((item) => {
                    const div = document.createElement("div");
                    div.className = "announcement-list-item";
                    div.innerHTML = `
                        <div class="item-header">
                            <span class="item-date">${escapeHtml(item.date || "")}</span>
                            <span class="item-title">${escapeHtml(item.title || "")}</span>
                        </div>
                        <div class="item-body">${escapeHtml(item.content || "")}</div>
                    `;
                    container.insertBefore(div, sentinel);
                });
                if (!announcementHasMore && sentinel) {
                    sentinel.remove();
                }
            } catch (error) {
                if (loadingEl) {
                    loadingEl.textContent = "加载失败";
                }
            } finally {
                announcementLoading = false;
                if (loadingEl && announcementHasMore) {
                    loadingEl.style.display = "none";
                }
            }
        }

        function dismissAnnouncement() {
            if (currentPopupSeenAt) {
                safeSetAnnouncementSeen(currentPopupSeenAt);
            }
            currentPopupSeenAt = null;
            if (announcementObserver) {
                announcementObserver.disconnect();
            }
            closeModal(announcementModal);
        }

        function initFloatingFeedback() {
            const circle = document.getElementById("floating-feedback");
            const closeBtn = document.getElementById("floating-feedback-close");
            if (!circle) {
                return;
            }
            const hiddenKey = "feedback_circle_hidden";
            try {
                if (!sessionStorage.getItem(hiddenKey)) {
                    circle.classList.remove("hidden");
                }
            } catch (error) {
                circle.classList.remove("hidden");
            }
            let dragState = null;
            function setPos(left, top) {
                circle.style.left = `${left}px`;
                circle.style.top = `${top}px`;
                circle.style.right = "auto";
                circle.style.bottom = "auto";
            }
            circle.addEventListener("pointerdown", (event) => {
                if (event.target === closeBtn) {
                    return;
                }
                const rect = circle.getBoundingClientRect();
                dragState = {
                    startX: event.clientX,
                    startY: event.clientY,
                    startLeft: rect.left,
                    startTop: rect.top,
                };
                circle.setPointerCapture(event.pointerId);
                circle.classList.add("dragging");
            });
            circle.addEventListener("pointermove", (event) => {
                if (!dragState) {
                    return;
                }
                setPos(
                    dragState.startLeft + event.clientX - dragState.startX,
                    dragState.startTop + event.clientY - dragState.startY,
                );
            });
            circle.addEventListener("pointerup", (event) => {
                if (!dragState) {
                    return;
                }
                const dx = event.clientX - dragState.startX;
                const dy = event.clientY - dragState.startY;
                const wasDrag = Math.abs(dx) > 3 || Math.abs(dy) > 3;
                dragState = null;
                circle.classList.remove("dragging");
                if (!wasDrag) {
                    openAnnouncementFromCircle();
                }
            });
            circle.addEventListener("pointercancel", () => {
                dragState = null;
                circle.classList.remove("dragging");
            });
            if (closeBtn) {
                closeBtn.addEventListener("click", (event) => {
                    event.stopPropagation();
                    circle.classList.add("hidden");
                    try {
                        sessionStorage.setItem(hiddenKey, "1");
                    } catch (error) {
                        // Ignore sessionStorage failures.
                    }
                });
            }
        }

        searchForm.addEventListener("submit", (event) => {
            event.preventDefault();
            hideRecentRolePanel();
            searchRole();
        });

        nameInput.addEventListener("focus", renderRecentRolePanel);
        nameInput.addEventListener("click", renderRecentRolePanel);
        nameInput.addEventListener("input", renderRecentRolePanel);
        nameInput.addEventListener("keyup", renderRecentRolePanel);
        serverInput.addEventListener("change", renderRecentRolePanel);

        recentRolePanel.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) {
                return;
            }
            const option = target.closest(".recent-role-option");
            if (option) {
                selectRecentRole(option);
            }
        });

        contentPanel.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) {
                return;
            }
            if (target.closest("#enqueue-sync-btn")) {
                enqueueSync();
                return;
            }
            if (target.closest("#refresh-role-indicator-btn")) {
                loadRoleIndicator(true);
                return;
            }
            if (target.closest("#refresh-match-list-btn")) {
                refreshCurrentMatches();
                return;
            }
            if (target.closest("#load-more-btn")) {
                loadMoreMatches();
                return;
            }
            const candidateButton = target.closest(".candidate-btn");
            if (candidateButton) {
                const server = candidateButton.getAttribute("data-candidate-server") || "";
                const name = candidateButton.getAttribute("data-candidate-name") || "";
                if (server && name) {
                    setServerInputValue(server);
                    nameInput.value = name;
                    hideRecentRolePanel();
                    searchRole();
                }
                return;
            }
            const matchButton = target.closest(".match-row-btn");
            if (!matchButton) {
                return;
            }
            const matchId = matchButton.getAttribute("data-match-id") || "";
            const focusPlayer = {
                name: matchButton.getAttribute("data-focus-name") || currentRole?.name || "",
                server: matchButton.getAttribute("data-focus-server") || currentRole?.server || "",
            };
            loadMatchDetail(matchId, focusPlayer);
        });

        document.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) {
                return;
            }
            if (target === nameInput || target.closest("#recent-role-panel")) {
                return;
            }
            hideRecentRolePanel();
        });

        matchModal.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) {
                return;
            }
            if (target === matchModal || target.closest("[data-close-modal='match']")) {
                closeModal(matchModal);
            }
        });

        announcementModal.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) {
                return;
            }
            if (target === announcementModal || target.closest("[data-close-modal='announcement']")) {
                dismissAnnouncement();
            }
        });

        if (announcementDismissBtn) {
            announcementDismissBtn.addEventListener("click", dismissAnnouncement);
        }

        document.addEventListener("keydown", (event) => {
            if (event.key !== "Escape") {
                return;
            }
            if (recentRolePanel.classList.contains("show")) {
                hideRecentRolePanel();
                return;
            }
            if (matchModal.classList.contains("show")) {
                closeModal(matchModal);
                return;
            }
            if (announcementModal.classList.contains("show")) {
                dismissAnnouncement();
            }
        });

        loadServerOptions();
        maybeShowAnnouncementOnLoad();
        initFloatingFeedback();
    </script>
</body>
</html>
